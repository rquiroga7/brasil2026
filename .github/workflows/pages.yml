name: Publicar sitio (GitHub Pages)

# Publica el dashboard estático. Los DATOS no se despliegan aquí: el navegador
# los consulta cada 60 s desde el endpoint sin caché (PUBLISH_URL).
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
